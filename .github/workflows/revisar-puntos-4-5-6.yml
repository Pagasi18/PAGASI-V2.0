name: Revisar datos de los puntos 4, 5 y 6 (solo lectura)

# A mano. Lista los creditos y motos que pudieron quedar mal por el wizard
# (modelo cambiado), el recalculo de mora (recuperados revividos, solicitudes
# aprobadas solas) e Inventario (motos recuperadas vueltas a financiada).
# Solo lectura; el log lleva numeros, no nombres.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node revisar-puntos-4-5-6.js
