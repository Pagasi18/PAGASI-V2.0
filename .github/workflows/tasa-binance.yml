name: Tasa Binance P2P

on:
  schedule:
    - cron: '0 13 * * *'   # 9:00 Venezuela (UTC-4). GitHub puede demorarlo unos minutos
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  tasa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node tasa-binance.js
