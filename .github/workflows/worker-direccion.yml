name: Worker de GPS (buscar su direccion)

# A mano. Pregunta a Telegram a donde manda los mensajes del bot (la direccion
# del Worker de Cloudflare), revisa que el Worker tenga /gps-refresco con un GET
# que no dispara nada y, SOLO si guardar=true y con el OK de Adam, la escribe
# en config/gps.workerUrl. El log es publico: la direccion no se imprime.
on:
  workflow_dispatch:
    inputs:
      guardar:
        description: 'Guardar la direccion en config/gps.workerUrl (con OK de Adam)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GUARDAR: ${{ inputs.guardar }}
        run: node worker-direccion.js
