name: Reglas de Firestore (publicar, con OK de Adam)

# Solo a mano. Publica firestore.rules del repo en Firebase, pero ANTES revisa
# y si algo no cuadra NO publica nada:
#   1. Lo publicado hoy es EXACTAMENTE firestore.rules del commit "base"
#      (nadie cambio las reglas directo en la consola de Firebase).
#   2. De "base" al repo el cambio solo AGREGA lineas.
#   3. Firebase compila las reglas nuevas sin errores.
# Con "dry" solo revisa. Deja escrito el ruleset anterior para volver atras.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Commit cuyas reglas son las publicadas hoy'
        type: string
        required: true
      dry:
        description: 'Solo revisar, sin publicar'
        type: boolean
        default: true
      lineas_cambiadas:
        description: 'Solo si Adam autorizo un cambio que MODIFICA lineas: cuantas exactamente (vacio = solo se permite agregar)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
          token_format: access_token
      - name: Revisar y publicar
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          BASE: ${{ inputs.base }}
          DRY: ${{ inputs.dry }}
          CAMBIADAS_OK: ${{ inputs.lineas_cambiadas }}
        run: |
          set -euo pipefail
          API=https://firebaserules.googleapis.com/v1
          P=projects/pagasi-v2
          if ! [[ "$BASE" =~ ^[0-9a-f]{7,40}$ ]]; then echo "RESULTADO ABORTADO: base no es un commit"; exit 1; fi
          git show "$BASE:firestore.rules" > base.rules

          # 1. Lo publicado hoy = firestore.rules de base
          code=$(curl -s -o release.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$API/$P/releases/cloud.firestore")
          if [ "$code" != "200" ]; then echo "No pude leer las reglas publicadas (HTTP $code):"; head -c 500 release.json; exit 1; fi
          ANTERIOR=$(python3 -c "import json;print(json.load(open('release.json'))['rulesetName'])")
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/$ANTERIOR" > anterior.json
          python3 -c "import json;open('publicadas.rules','w').write(json.load(open('anterior.json'))['source']['files'][0]['content'])"
          echo "Publicadas ahora: $ANTERIOR"
          if diff -q publicadas.rules firestore.rules >/dev/null; then echo "RESULTADO YA_PUBLICADAS: no hay nada que hacer"; exit 0; fi
          if ! diff -q publicadas.rules base.rules >/dev/null; then
            echo "RESULTADO ABORTADO: lo publicado NO es igual a firestore.rules de $BASE (alguien cambio las reglas en la consola). No se publica nada."
            diff -u base.rules publicadas.rules | head -80 || true
            exit 1
          fi
          echo "1/3 OK: lo publicado es exactamente firestore.rules de $BASE"

          # 2. El cambio solo agrega lineas
          QUITADAS=$(diff base.rules firestore.rules | grep -c '^<' || true)
          AGREGADAS=$(diff base.rules firestore.rules | grep -c '^>' || true)
          if [ "$QUITADAS" != "0" ]; then
            # Un cambio que modifica lineas solo pasa con el numero EXACTO autorizado
            # (puntos 1 y 2 de seguridad, 19-sep-2026: 8 lineas). Cualquier otro numero aborta.
            if [ -n "$CAMBIADAS_OK" ] && [ "$QUITADAS" = "$CAMBIADAS_OK" ]; then
              echo "2/3 OK CON PERMISO: el cambio modifica exactamente $QUITADAS linea(s), las autorizadas, y agrega $AGREGADAS. Diferencia completa:"
              diff -u base.rules firestore.rules || true
            else
              echo "RESULTADO ABORTADO: el cambio quita o modifica $QUITADAS linea(s) (autorizadas: ${CAMBIADAS_OK:-0}). No se publica nada."
              diff -u base.rules firestore.rules || true
              exit 1
            fi
          else
            echo "2/3 OK: el cambio solo agrega $AGREGADAS lineas:"
            diff base.rules firestore.rules | grep '^>' | cut -c3- || true
          fi

          # 3. Firebase compila las reglas nuevas
          python3 -c "import json;print(json.dumps({'source':{'files':[{'name':'firestore.rules','content':open('firestore.rules').read()}]}}))" > fuente.json
          code=$(curl -s -o prueba.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @fuente.json "$API/$P:test")
          if [ "$code" = "200" ]; then
            ERRORES=$(python3 -c "import json;d=json.load(open('prueba.json'));i=d.get('issues',[]);print(sum(1 for x in i if x.get('severity')=='ERROR'))")
            AVISOS=$(python3 -c "import json;d=json.load(open('prueba.json'));i=d.get('issues',[]);print(sum(1 for x in i if x.get('severity')!='ERROR'))")
            if [ "$ERRORES" != "0" ]; then echo "RESULTADO ABORTADO: Firebase encontro $ERRORES error(es) en las reglas:"; cat prueba.json; exit 1; fi
            echo "3/3 OK: Firebase compila las reglas nuevas (0 errores, $AVISOS aviso(s))"
          elif [ "$code" = "403" ]; then
            echo "3/3 AVISO: sin permiso para compilar de prueba; al publicar, Firebase igual rechaza reglas con errores"
          else
            echo "RESULTADO ABORTADO: no pude compilar de prueba (HTTP $code)"; head -c 1500 prueba.json; exit 1
          fi

          if [ "$DRY" = "true" ]; then echo "RESULTADO DRY_OK: todo cuadra; no se publico nada"; exit 0; fi

          # Publicar: crear el ruleset nuevo y apuntar la release de Firestore a el
          code=$(curl -s -o nuevo.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @fuente.json "$API/$P/rulesets")
          if [ "$code" != "200" ]; then echo "RESULTADO ABORTADO: Firebase no acepto las reglas (HTTP $code). Lo publicado sigue siendo $ANTERIOR"; head -c 2000 nuevo.json; exit 1; fi
          NUEVO=$(python3 -c "import json;print(json.load(open('nuevo.json'))['name'])")
          python3 -c "import json,sys;print(json.dumps({'release':{'name':sys.argv[1]+'/releases/cloud.firestore','rulesetName':sys.argv[2]}}))" "$P" "$NUEVO" > release-nueva.json
          code=$(curl -s -o publicado.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data @release-nueva.json "$API/$P/releases/cloud.firestore")
          if [ "$code" != "200" ]; then echo "RESULTADO ERROR: se creo $NUEVO pero no se pudo activar (HTTP $code). Lo publicado sigue siendo $ANTERIOR"; head -c 1000 publicado.json; exit 1; fi
          echo "Publicado: $NUEVO"
          echo "Para volver atras: activar de nuevo $ANTERIOR"

          # Verificar que Firebase tiene exactamente lo del repo
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/$P/releases/cloud.firestore" > release2.json
          AHORA=$(python3 -c "import json;print(json.load(open('release2.json'))['rulesetName'])")
          curl -sf -H "Authorization: Bearer $TOKEN" "$API/$AHORA" > ahora.json
          python3 -c "import json;open('ahora.rules','w').write(json.load(open('ahora.json'))['source']['files'][0]['content'])"
          if diff -q ahora.rules firestore.rules >/dev/null; then
            echo "RESULTADO PUBLICADAS: Firebase tiene exactamente firestore.rules del repo ($AHORA)"
          else
            echo "RESULTADO REVISAR: lo publicado ($AHORA) no coincide con el repo"; exit 1
          fi
