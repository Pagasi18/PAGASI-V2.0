name: Posiciones GPS (MiCODUS)

on:
  schedule:
    # Respaldo una vez al dia (10:00 am Venezuela = 14:00 UTC). El disparo bueno
    # viene del Worker de Cloudflare a las 8:00 am, que si respeta la hora (el
    # cron de GitHub en repos publicos se retrasa horas enteras). Si el Worker ya
    # barrio ese dia, el robot ve que no pasaron 20 horas y no hace nada.
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# Un barrido a la vez: un boton y el disparo de las 8 no barren en paralelo. La
# corrida que llega mientras otra trabaja espera su turno (no se cancela).
concurrency:
  group: gps-micodus
  cancel-in-progress: false

jobs:
  posiciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        env:
          MICODUS_USER: ${{ secrets.MICODUS_USER }}
          MICODUS_PASS: ${{ secrets.MICODUS_PASS }}
        run: node gps-micodus.js
