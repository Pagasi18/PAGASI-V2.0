name: Cargar GPS instalados (manual)

# Carga puntual desde el Excel maestro. Solo a mano, nunca automatico.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Solo mostrar lo que haria, sin escribir'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node gps-cargar-instalados.js ${{ inputs.dry && '--dry' || '' }}
