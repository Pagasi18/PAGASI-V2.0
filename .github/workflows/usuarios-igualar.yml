name: Usuarios (igualar permisos, con simulacion)

# A mano. Copia el rol y los permisos de un usuario a otro. Por defecto SOLO
# SIMULA; guardar=true escribe. Sin nombres completos en el log publico.
on:
  workflow_dispatch:
    inputs:
      de:
        description: 'Usuario ORIGEN (parte del nombre, ej. samanta)'
        type: string
        required: true
      a:
        description: 'Usuario DESTINO (parte del nombre, ej. jofanny)'
        type: string
        required: true
      guardar:
        description: 'true = escribir de verdad (por defecto solo simula)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  igualar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        env:
          DE: ${{ inputs.de }}
          A: ${{ inputs.a }}
          GUARDAR: ${{ inputs.guardar }}
        run: node usuarios-igualar.js
