name: Revisar datos antes de las Reglas de seguridad (solo lectura)

# A mano. Clientes con codigo metido en sus datos, leads web que la regla nueva
# rechazaria, usuarios por rol e invitaciones sin usar. Solo lectura; sin nombres.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node revisar-seguridad-1-2.js
