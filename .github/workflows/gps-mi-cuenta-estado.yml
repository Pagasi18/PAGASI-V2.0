name: GPS en Mi cuenta (estado, solo lectura)

# A mano. Muestra que clientes tienen el GPS visible en Mi cuenta, si su ficha
# tiene posicion, hace cuanto la reviso el robot y los pedidos del boton.
# Solo lectura; sin nombres, telefonos ni coordenadas en el log.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node gps-mi-cuenta-estado.js
