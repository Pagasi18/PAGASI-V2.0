name: Cuentas - dinero devuelto de mas (solo lectura)

# A mano. Punto 3 de la lista de arreglos: mide cuanto dinero de mas muestran las
# cuentas porque borrar una moto o un pago de comision devuelve el dinero dos veces
# (o lo devuelve aunque se eligio no devolverlo). Solo lectura; sin nombres ni saldos en el log.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node cuentas-reversos.js
