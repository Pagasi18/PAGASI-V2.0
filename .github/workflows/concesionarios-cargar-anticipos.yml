name: Concesionarios (cargar anticipos del Excel)

# A mano. Por defecto SOLO SIMULA. Con guardar=true escribe los anticipos del
# plan en cada sede (idempotente: no duplica). solo_sede para probar en una.
on:
  workflow_dispatch:
    inputs:
      guardar:
        description: 'true = escribir de verdad (por defecto solo simula)'
        type: boolean
        default: false
      solo_sede:
        description: 'ID de una sede (CONC-...) para cargar solo esa'
        type: string
        default: ''
      plan_b64:
        description: 'Plan de anticipos (JSON gzip+base64)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  cargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        env:
          GUARDAR: ${{ inputs.guardar }}
          SOLO_SEDE: ${{ inputs.solo_sede }}
          PLAN_B64: ${{ inputs.plan_b64 }}
        run: node concesionarios-cargar-anticipos.js
