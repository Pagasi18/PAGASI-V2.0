name: Reglas de Firestore (comparar publicadas vs repo)

# Solo lectura: baja las reglas que estan PUBLICADAS en Firebase y las compara
# con firestore.rules del repo. Sirve para saber si pegar el archivo del repo
# en la consola pisaria algo que se cambio directo en Firebase. Solo a mano.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
          token_format: access_token
      - name: Comparar publicadas vs repo
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          API=https://firebaserules.googleapis.com/v1/projects/pagasi-v2
          code=$(curl -s -o release.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$API/releases/cloud.firestore")
          if [ "$code" != "200" ]; then echo "No pude leer las reglas publicadas (HTTP $code):"; head -c 500 release.json; exit 1; fi
          RULESET=$(python3 -c "import json;print(json.load(open('release.json'))['rulesetName'])")
          echo "Publicadas: $RULESET · actualizadas $(python3 -c "import json;print(json.load(open('release.json')).get('updateTime',''))")"
          curl -sf -H "Authorization: Bearer $TOKEN" "https://firebaserules.googleapis.com/v1/$RULESET" > ruleset.json
          python3 -c "import json;d=json.load(open('ruleset.json'));f=d['source']['files'];print(len(f),'archivo(s) en el ruleset');open('publicadas.rules','w').write(f[0]['content'])"
          if diff -u publicadas.rules firestore.rules > dif.txt; then
            echo "RESULTADO IGUALES: las reglas publicadas son exactamente las del repo"
          else
            echo "RESULTADO DIFERENTES ($(grep -c '^[-+][^-+]' dif.txt) lineas):"
            cat dif.txt
          fi
