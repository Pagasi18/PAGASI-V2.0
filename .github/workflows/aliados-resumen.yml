name: Portal de aliados - resumenes por sede

# Cada hora arma el resumen de cada concesionario (ventas, saldo del deposito, nivel,
# comision estimada, solicitudes, calidad de cartera y ranking) con los datos de PAGASI 18
# y PAGASI 26, y lo escribe en `aliados_resumen` de la 26: es lo unico que el aliado puede
# leer desde pagasi.io/aliados. El log es publico: solo cantidades, sin nombres.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      solo_leer:
        description: 'Solo calcular y mostrar, sin escribir'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: aliados-resumen
  cancel-in-progress: false

jobs:
  resumir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        env:
          SOLO_LEER: ${{ inputs.solo_leer && '1' || '' }}
        run: node aliados-resumen.js
