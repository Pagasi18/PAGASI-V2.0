name: Probar con datos reales (solo lectura)

# Corre el app completo dos veces con los datos reales de Firestore (codigo
# viejo vs codigo nuevo) y compara calculos, pantallas, escrituras al abrir y
# tiempos. No escribe nada en la base: el app trabaja sobre una copia en
# memoria. Solo a mano.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama o commit a probar (el codigo NUEVO)'
        type: string
        default: 'main'
      viejo:
        description: 'Commit de referencia (el codigo de ANTES)'
        type: string
        default: 'e9cb6b7'

permissions:
  contents: read
  id-token: write

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Caracas
      VIEJO: ${{ inputs.viejo }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          project_id: pagasi-v2
          workload_identity_provider: projects/951911859002/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@pagasi-v2.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: bot
        run: npm install --omit=dev
      - working-directory: bot
        run: node --max-old-space-size=4096 probar-datos-reales.js --viejo="$VIEJO"
